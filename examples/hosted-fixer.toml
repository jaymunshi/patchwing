# Local detection, hosted fixer — the common shape.
#
# Detection and localization run on your machine with small open-weight models.
# Only the fixer calls out, and only for candidates that already survived local
# triage. That keeps cost low and keeps most of your code off the wire, while
# still getting a large model where patch quality actually depends on it.
#
# Know what leaves: the fixer sees the vulnerable function, its surrounding
# context, and the taint path. If that is unacceptable for your codebase, use
# local-only.toml instead.
#
# Set your key first — never inline it here:
#   export PATCHWING_PATCH_KEY=...
#   export PATCHWING_VERIFY_KEY=...

# Small, specialised, local. A 7B trained for this beats a general large model,
# and it costs nothing per call.
[models.detect]
endpoint = "http://localhost:8000/v1"
model = "UCSB-SURFI/VulnLLM-R-7B"
temperature = 0.1
max_tokens = 4096

# The one stage that genuinely wants a large model.
[models.patch]
endpoint = "https://your-provider.example.com/v1"
model = "your-large-code-model"
api_key_env = "PATCHWING_PATCH_KEY"
temperature = 0.2
max_tokens = 8192
timeout_s = 600

# Adversarial second opinion — different family than the fixer.
[models.verify]
endpoint = "https://your-provider.example.com/v1"
model = "a-different-family-model"
api_key_env = "PATCHWING_VERIFY_KEY"
temperature = 0.0
max_tokens = 4096
timeout_s = 600

[sandbox]
backend = "podman"
network = "none"
cpus = 2.0
memory = "4g"

[pipeline]
db = "patchwing.db"
workdir = ".patchwing"
max_attempts = 3
reproducer_scope = "definition_a"
