# Run config for the ARVO 1237 milestone. Everything goes to Together.

[models.patch]
endpoint = "https://api.together.ai/v1"
model = "moonshotai/Kimi-K2.7-Code"
api_key_env = "TOGETHER_API_KEY"
temperature = 0.2
max_tokens = 30000
timeout_s = 600

# The advisory seat. A DIFFERENT model family from the fix-writer on purpose —
# an author reviewing itself is not a second opinion. Its verdict cannot change
# the result: the container has already ruled before this is called.
#
# GLM's verdict is known to move with thinking on vs off, which is why the exact
# reviewer config is recorded beside its opinion in the package.
[models.verify]
endpoint = "https://api.together.ai/v1"
model = "zai-org/GLM-5.2"
api_key_env = "TOGETHER_API_KEY"
temperature = 0.0
max_tokens = 4096
timeout_s = 900

[sandbox]
backend = "podman"
image = "docker.io/n132/arvo:1237-vul"
network = "none"
cpus = 6.0
memory = "12g"
# PER-COMMAND, not per-run — verified in sandbox.py: each exec gets its own
# subprocess timeout. So the verify build and the rollback build each get the
# full ceiling, and a slow first build cannot silently steal the rollback's
# budget. Generous because this is a wireshark compile, not a python package.
timeout_s = 5400

[pipeline]
workdir = ".patchwing_1237"
db = "arvo1237.db"
max_attempts = 2
max_patch_bytes = 65536
reproducer_scope = "definition_a"
